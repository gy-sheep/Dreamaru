<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <!-- 두루마리 휴지 스테이지용 만화풍 벡터 (프로토타입). 가는 회색 외곽선 + 부드러운 면.
       롤은 옆으로 누운 원기둥이고, 롤과 같은 폭의 휴지 한 장이 롤 윗면에서 이어져 화면 아래로 흘러내린다.
       앞쪽 단면(face)은 끊김 없는 완전한 타원이며, 휴지의 왼쪽 가장자리는 단면의 가장 오른쪽 지점에서 접선으로 내려간다. -->
  <defs>
    <linearGradient id="wallShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6e8ec"/>
      <stop offset="1" stop-color="#dde0e5"/>
    </linearGradient>
    <linearGradient id="paperShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fafafb"/>
      <stop offset="1" stop-color="#eceef2"/>
    </linearGradient>
    <linearGradient id="undersideShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bcc2"/>
      <stop offset="1" stop-color="#d2d5da"/>
    </linearGradient>
  </defs>

  <!-- 벽 (게임에서 배경만 바꿀 수 있도록 id 지정) -->
  <rect id="wall" x="0" y="0" width="400" height="440" fill="url(#wallShade)"/>

  <!-- 벽걸이 금속 거치대(뒤쪽): 받침판 + 롤 위를 지나 오른쪽 끝에서 롤 윗면 쪽으로 꺾이는 팔 -->
  <g id="holder" stroke-linejoin="round" stroke-linecap="round">
    <path d="M100 66 H298 V114" fill="none" stroke="#6c7076" stroke-width="14"/>
    <path d="M100 66 H298 V114" fill="none" stroke="#cfd2d7" stroke-width="8"/>
    <rect x="22" y="26" width="86" height="76" rx="10" fill="#b9bcc2" stroke="#6c7076" stroke-width="4"/>
    <rect x="30" y="34" width="70" height="60" rx="6" fill="#c3c6cb" stroke="#8c9096" stroke-width="2.5"/>
    <circle cx="52" cy="52" r="7" fill="#6c7076"/>
    <circle cx="52" cy="78" r="7" fill="#6c7076"/>
  </g>

  <!-- 롤 아랫면 음영: 단면과 휴지 왼쪽 가장자리 사이. 외곽선은 긋지 않는다(가로선 없음). 휴지 왼쪽 외곽선 아래에 깔리도록 휴지보다 먼저 그린다 -->
  <path id="underside" d="M110 189 H146 V261 H110 Z" fill="url(#undersideShade)" stroke="none"/>

  <!-- 몸통 + 늘어진 휴지: 윗변은 롤 윗선, 오른쪽 윗모서리는 종이가 꺾이며 둥글고, 아래는 화면 밖으로 이어진다 -->
  <g id="sheet" stroke-linejoin="round" stroke-linecap="round">
    <path d="M110 118 Q200 112 286 116 Q306 120 308 144 L312 460 L146 460 L146 189 L110 150 Z" fill="url(#paperShade)" stroke="none"/>
    <!-- 종이 무늬: 절취선(점선)이 일정 간격으로 반복되고, 그 사이마다 짧은 세로 결 두 줄이 좌우로 번갈아 놓인다.
         휴지가 풀리면 이 무늬가 같이 흘러내려 움직임이 보인다. 간격은 112 단위 -->
    <g id="paperPattern" fill="none" stroke-linecap="round">
      <!-- 절취선 -->
      <path d="M146 188 Q228 200 307 188" stroke="#b9bcc7" stroke-width="3" stroke-dasharray="7 8"/>
      <path d="M146 300 Q228 312 308 300" stroke="#b9bcc7" stroke-width="3" stroke-dasharray="7 8"/>
      <path d="M146 412 Q228 424 309 412" stroke="#b9bcc7" stroke-width="3" stroke-dasharray="7 8"/>
      <!-- 절취선 사이의 세로 결 -->
      <path d="M196 124 Q192 152 198 176" stroke="#c4c8ce" stroke-width="3"/>
      <path d="M246 124 Q252 152 248 178" stroke="#c4c8ce" stroke-width="3"/>
      <path d="M214 212 Q210 252 216 288" stroke="#c4c8ce" stroke-width="3"/>
      <path d="M268 212 Q274 252 270 290" stroke="#c4c8ce" stroke-width="3"/>
      <path d="M196 324 Q192 364 198 400" stroke="#c4c8ce" stroke-width="3"/>
      <path d="M246 324 Q252 364 248 402" stroke="#c4c8ce" stroke-width="3"/>
      <path d="M214 436 Q212 448 214 460" stroke="#c4c8ce" stroke-width="3"/>
      <path d="M268 436 Q270 448 270 460" stroke="#c4c8ce" stroke-width="3"/>
    </g>
    <!-- 외곽선: 오른쪽 윗모서리부터 아래로, 윗변, 왼쪽 가장자리(단면의 오른쪽 끝에서 시작) -->
    <path d="M110 118 Q200 112 286 116 Q306 120 308 144 L312 460" fill="none" stroke="#6c7076" stroke-width="4"/>
    <path d="M146 189 L146 460" fill="none" stroke="#6c7076" stroke-width="4"/>
  </g>

  <!-- 롤의 앞쪽 단면: 겹겹이 감긴 종이와 가운데 종이심 -->
  <g id="face" stroke-linejoin="round">
    <ellipse cx="110" cy="189" rx="36" ry="72" fill="#fbfbfc" stroke="#6c7076" stroke-width="4"/>
    <ellipse cx="110" cy="189" rx="28" ry="56" fill="none" stroke="#c4c8ce" stroke-width="2.5"/>
    <ellipse cx="110" cy="189" rx="20" ry="40" fill="none" stroke="#cfd2d8" stroke-width="2.5"/>
    <ellipse cx="110" cy="189" rx="12" ry="25" fill="#b98251" stroke="#6c7076" stroke-width="3"/>
    <ellipse cx="110" cy="189" rx="7" ry="15" fill="#8f5f35"/>
    <path d="M110 166 V212 M99 189 H121" fill="none" stroke="#6a4526" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 거치대 스핀들(앞쪽): 받침판 아래에서 종이심 속으로 -->
  <g id="spindle" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 102 C58 142 76 172 104 186" stroke="#6c7076" stroke-width="14"/>
    <path d="M62 102 C58 142 76 172 104 186" stroke="#cfd2d7" stroke-width="8"/>
  </g>
</svg>
